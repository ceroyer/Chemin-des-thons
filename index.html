<style>
/* Mise en page : barre de progression collée en haut, bandeau fin de 56 px, puis la scène sous-marine qui occupe tout le reste. La question est une feuille posée en bas de la scène. */
:root{
  --ink:#14305E; --bg:#F4F7FB; --blue:#D6E4F7; --sun:#FFE79A; --line:#6F8CB8; --soft:#4A6390;
  --ok:#17603B; --okbg:#DDF3E6; --ko:#8F2A1E; --kobg:#FBE3DE;
  --font:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --card:#fff;--tint:#E3EEFB;--tint2:#EEF2F8;--sunbg:#FFF6D1;--warm:#FFF1E0;--okchip:#D6F2E2;--prim:#14305E;--onprim:#fff;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top) + 4px);background:var(--bg)}
@media (display-mode:standalone),(display-mode:fullscreen){#app{padding-top:calc(env(safe-area-inset-top) + 16px)}}
.sa #app{padding-top:calc(env(safe-area-inset-top) + 16px)}
#top{flex:none}
#prog{height:8px;background:var(--blue);flex:none;overflow:hidden}
#progFill{display:block;height:100%;width:0;background:var(--prim);border-radius:0 4px 4px 0}
.hud{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px}
.btn.icon{width:44px;height:44px;min-height:0;padding:0;display:grid;place-items:center;flex:none}
.btn.icon svg{display:block;margin:0}
.stats{display:flex;gap:16px}
.stat{display:flex;flex-direction:column;line-height:1.05;min-width:44px}
.stat span{font-size:.75rem;color:var(--soft)}
.stat b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.lifebox{margin-left:auto;text-align:right;line-height:1.15;min-width:0}
.lifebox span{display:block;font-size:.8rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hearts{display:flex;gap:2px;justify-content:flex-end}
#hearts svg{width:20px;height:20px}
.btn{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 14px;min-height:44px;cursor:pointer;transition:transform .12s,background .12s}
.btn:active:not(:disabled){transform:scale(.96)}
@media (hover:hover){.btn:hover:not(:disabled):not(.primary):not([aria-pressed="true"]):not([aria-selected="true"]){background:var(--blue)}}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--prim);border-color:var(--prim);color:var(--onprim)}
@media (hover:hover){.btn.primary:hover:not(:disabled){background:#0E2347}
:root[data-theme="dark"] .btn.primary:hover:not(:disabled){background:#8BBBFF}}
@media (hover:hover) and (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary:hover:not(:disabled){background:#8BBBFF}}
.btn.big{font-size:1.2rem;padding:10px 22px;min-height:54px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--sun)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;left:0;top:0;display:block}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:640px;font-size:clamp(1rem,3.6vw,1.25rem);line-height:1.3;padding:10px 16px;border-radius:14px;border:2px solid var(--ok);background:var(--okbg);color:var(--ok);font-weight:700;text-align:center;text-wrap:balance;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.warn{background:var(--sunbg);color:var(--ink);border-color:#B07A00}
#toast.ko{background:var(--kobg);color:var(--ko);border-color:var(--ko)}
.lrow{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;min-width:36px;min-height:32px;padding:0 8px;border-radius:10px;border:2px solid var(--line);background:var(--card);font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.chip:disabled{opacity:.5;cursor:default}
.chip.ready,#btnLamp.ready{background:var(--sun);border-color:var(--ink);animation:flame2 .9s infinite}
#btnLamp{display:inline-flex;align-items:center;gap:6px}
#sheet{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));background:var(--card);border:2px solid var(--blue);border-radius:18px;padding:10px 12px 12px;box-shadow:0 6px 24px rgba(20,48,94,.28);animation:slideUp .3s cubic-bezier(.2,1.3,.4,1)}
.trow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#timer{flex:1;height:14px;background:var(--blue);border-radius:7px;overflow:hidden}
#timerFill{display:block;height:100%;width:100%;background:#2F6FDB;border-radius:7px}
#timer.low #timerFill{background:#D8402F;animation:flame .5s infinite}
#timerTxt{min-width:2ch;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
#btnLamp{min-height:40px;padding:2px 12px;font-size:.95rem}
#staff{display:flex;justify-content:center;margin:0 0 4px;color:var(--ink)}#staff svg{height:clamp(74px,13vh,104px);width:auto;max-width:100%;display:block}#sheet.fbmode #staff,#sheet.fbmode #qhint{display:none}#qhint{margin:0 0 8px;text-align:left;font-size:.9rem;color:var(--soft)}
#qtext{margin:0 0 8px;font-size:1.25rem;line-height:1.25;text-wrap:balance}
#opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;font-size:1.05rem;min-height:56px;padding:6px 10px;animation:pop .28s both}
.opt:nth-child(2){animation-delay:.04s}.opt:nth-child(3){animation-delay:.08s}.opt:nth-child(4){animation-delay:.12s}

.opt .mark{margin-left:auto;font-size:.8rem}
.opt.off{opacity:.45;text-decoration:line-through}
#fb{font-size:1rem}#fb .you{margin:0;font-size:.9rem;font-weight:700;color:var(--ko)}#fb .ans,#intro .big{margin:0 0 4px;font-size:1.25rem;line-height:1.2;font-weight:800;text-wrap:balance}.cellrow{display:flex;gap:6px;margin:6px 0}.cellrow .c{flex:1 1 0;min-width:0;text-align:center;border:2px solid var(--line);border-radius:10px;padding:3px 2px;font-size:.82rem;line-height:1.2;background:var(--card);color:var(--ink)}.cellrow .c b{display:block;font-size:clamp(.8rem,3.5vw,.95rem);white-space:nowrap}#sheet.fbmode #qtext{display:none}.cellrow .c.ok{background:var(--ok);border-color:var(--ok);color:var(--card)}.cellrow .c.ko{background:var(--kobg);border-color:var(--ko);color:var(--ko);text-decoration:line-through}#fb .rule,#intro .rule,.dlg .rule{margin:2px 0 0;font-size:1rem;font-weight:600}.stf{display:flex;justify-content:center;color:var(--ink);margin:2px 0}.stf svg{height:78px;width:auto;max-width:100%;display:block}#sheet.fbmode #after .btn{min-height:48px}#sheet.read #qtext{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}#sheet.read #staff svg{height:clamp(70px,11vh,88px)}#sheet.read #qhint{margin:0 0 6px;font-size:.88rem}#sheet.read #opts{gap:6px;grid-template-columns:1fr 1fr}@media (max-width:380px){#sheet.read .opt .key{display:none}#sheet.read .opt{padding:6px 10px}}#sheet.read .opt{min-height:48px}
#fb:empty{display:none}
#fb p{margin:2px 0}
#fb .row{font-size:.92rem}
#after{margin-top:8px}
#after .btn{width:100%}
#overlay.bottom{background:transparent;place-items:end center;pointer-events:none;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
#overlay.bottom .dlg{pointer-events:auto;max-height:62dvh;text-align:center}
#overlay.bottom .acts{justify-content:center}#overlay.bottom .reward{margin-left:auto;margin-right:auto}#overlay.bottom .chestzone{place-items:center}
#overlay.bottom .bigstars{margin:0}
#overlay.bottom h2{margin-bottom:2px}
.dlg.split{display:flex;flex-direction:column;padding:0;overflow:hidden;height:calc(100dvh - 24px);max-height:760px}
.split .hd{flex:none}
.split .hd h2{margin:0;padding:12px 16px 8px}
.split #pv{display:block;width:100%;max-width:none;margin:0;border-radius:0;aspect-ratio:480/270}
.split .bd{flex:1;min-height:0;overflow:auto;padding:4px 16px 12px;overscroll-behavior:contain}
.split .ft{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:2px solid var(--line);background:var(--bg)}
.split .ft .btn{width:100%}
.split .ft.foot{display:flex;gap:10px;align-items:stretch}
.split .ft.foot .btn.primary{flex:1 1 0;min-width:0;width:auto}@media (max-width:340px){.split .ft.foot{flex-wrap:wrap}.split .ft.foot .btn.danger{flex:1 1 100%;justify-content:center}}
.split .ft.foot .btn.danger{width:auto;flex:none;display:inline-flex;align-items:center;gap:6px;min-height:54px;color:#8F1E14;border-color:#E8B4AE;background:var(--card);font-size:.95rem}
.choices{display:flex;flex-direction:column;gap:8px}
.btn.choice{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:10px 14px;width:100%;min-height:0}
.btn.choice b{font-size:1.05rem}
.btn.choice small{font-size:.88rem;line-height:1.35;font-weight:400}
.btn.choice[aria-pressed="true"]{background:var(--prim);border-color:var(--prim);color:var(--onprim)}
#overlay.full{background:var(--bg);place-items:start center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}#overlay.full .dlg{box-shadow:none;border-radius:0;max-height:none;overflow:visible;animation:none;padding:0;max-width:min(560px,100%)}#overlay.full.splitmode{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}#overlay.full .dlg.split{overflow:hidden;height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));max-height:none;background:transparent}#overlay{position:fixed;inset:0;background:rgba(20,48,94,.62);display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;overflow:auto;z-index:10}
.dlg{background:var(--bg);border-radius:22px;padding:18px 20px;max-width:640px;width:100%;max-height:calc(100dvh - 24px);overflow:auto;box-shadow:0 12px 40px rgba(20,48,94,.35);animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
.dlg h1,.dlg h2,.dlg h3{margin:0 0 6px;line-height:1.15;text-wrap:balance}
.dlg h1{font-size:1.9rem}.dlg h2{font-size:1.5rem}.dlg h3{font-size:1.05rem;margin-top:14px}
.dlg p{margin:6px 0 10px;max-width:62ch}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.acts.col{flex-direction:column}
.acts.col .btn{width:100%}
.badge{display:inline-block;background:var(--sun);border-radius:999px;padding:4px 14px;font-weight:700;margin-bottom:8px}
.count{margin:0 0 6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.chips li{background:var(--sun);border-radius:10px;padding:4px 10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.tg{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;padding:6px 12px;font-size:.85rem;line-height:1.1}
.tg svg{display:block}
.tg .slash{display:none}
.tg[aria-pressed="false"]{opacity:.6}
.tg[aria-pressed="false"] .slash{display:block}
.seg .btn.tg[aria-pressed="true"]{background:var(--card);color:var(--ink);border-color:var(--line)}
.opt.gone{animation:poof .4s ease-in forwards;pointer-events:none}
@keyframes poof{0%{transform:scale(1);opacity:1}30%{transform:scale(1.06) rotate(-2deg)}100%{transform:scale(.2) rotate(8deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.opt.gone{animation:none;opacity:0}}
.btn svg,.chip svg{display:block;flex:none}
.chip,#btnLamp,#hDice,.tile{display:inline-flex;align-items:center;justify-content:center}
.chip b,#btnLamp b{line-height:1}
#invShield{display:inline-flex;align-items:center;justify-content:center;padding:0;width:36px;height:32px;box-sizing:border-box}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;flex-direction:column;gap:4px;min-height:68px;padding:8px 4px;font-size:.88rem;line-height:1.1}
.tile .dot{position:absolute;top:6px;right:8px}
.lvls{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}
.btn.lvl{display:flex;align-items:stretch;gap:10px;text-align:left;padding:8px;min-height:0;width:100%}
.btn.lvl.cur{border-color:var(--ink);box-shadow:0 0 0 2px var(--sun)}
.btn.lvl.bonus{background:var(--sunbg);border-color:#B07A00}
.btn.lvl:disabled{opacity:1;background:var(--tint2)}
.btn.lvl:disabled .bd,.btn.lvl:disabled .sw{opacity:.55}
.lvl .sw{flex:none;width:48px;min-height:48px;border-radius:12px;display:grid;place-items:center;border:2px solid var(--line)}
.lvl .sw b{font-size:1.2rem}
.lvl .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lvl .tt{font-weight:700;font-size:1.02rem}
.lvl .sub{font-size:.88rem}
.lvl .cs{display:flex;flex-wrap:wrap;gap:4px}
.lvl .cc{font-size:.78rem;padding:2px 7px;border-radius:8px;background:var(--tint);border:1px solid var(--line)}
.lvl .cc.ok{background:var(--okchip);border-color:#17603B}
.lvl .cc.new{background:var(--card);opacity:.8}
.lvl .st{flex:none;align-self:center;font-weight:700;font-size:.85rem;min-width:24px;display:grid;place-items:center}
.today{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin:8px 0 12px}
.today .trow2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.today .strk{display:flex;align-items:center;gap:8px;min-width:0}

.today b{font-size:1.05rem;line-height:1.1}
.today .snum{font-size:1.7rem;line-height:1}.today .buoy{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 12px;font-size:1.05rem}.today .buoy.none{opacity:.55}.today .buoytip{margin:8px 0 0;padding:8px 10px;border-radius:12px;background:var(--sunbg);border:2px solid #B07A00;font-size:.92rem}.rh{margin:4px 0 6px;font-size:1rem}.recs2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:4px 0 10px}.recs2 div{border:2px solid var(--line);border-radius:12px;padding:6px 4px}.recs2 b{display:block;font-size:1.3rem}.recs2 small{display:block;font-size:.75rem;line-height:1.2}
.today .daily{display:flex;justify-content:space-between;gap:8px;margin:8px 0 0;padding-top:8px;border-top:2px solid var(--tint);font-size:.9rem}.today .daily.done{color:var(--ok);font-weight:700}

.links{display:flex;justify-content:flex-start;gap:16px}.acts.col .links .btn,.links .btn{width:auto;flex:none;padding-left:0;padding-right:8px}.say.ctr{text-align:center}.links.ctr{justify-content:center}.links.ctr .btn{padding:0 8px}

@keyframes chestShake{0%,100%{transform:rotate(0)}10%{transform:rotate(-7deg) scale(1.04)}25%{transform:rotate(7deg) scale(1.08)}40%{transform:rotate(-8deg) scale(1.1)}55%{transform:rotate(8deg) scale(1.1)}70%{transform:rotate(-4deg) scale(1.06)}}

function genLevel(n,seed,ti){
  const r=mulberry32(seed);

  const theme=THEMES[ti!=null?ti:(n-1)%THEMES.length];
  const obstacles=[];let x=560,bag=[];
  for(let i=0;i<count;i++){
    if(!bag.length){bag=shuffle(theme.pool.slice(),r);if(i&&bag[bag.length-1]===obstacles[i-1].kind)bag.unshift(bag.pop());}

  const goalX=obstacles[count-1].x+480;

    x:obstacles[i].x+190+Math.floor(r()*60-30),
    kind:['heart','shield','lamp','star'][Math.floor(r()*4)],got:false}));

  },
  start(i){

    if(A.running){A.mus.gain.cancelScheduledValues(c.currentTime);A.mus.gain.setTargetAtTime(0,c.currentTime,.08);}

  },
  stop(){

  }

    const st=stats(save);

  const l=(L(a)+L(b))/2,dark=.0301,cd=(l+.05)/(dark+.05),cw=1.05/(l+.05);return cd>=cw?'#14305E':'#FFFFFF';

  ctx.fillStyle='rgba(20,48,94,.12)';for(let x=-(camX%70);x<W;x+=70){ctx.fillRect(x+10,GY+34,26,5);ctx.fillRect(x+42,GY+62,18,5);ctx.fillRect(x+4,GY+96,22,5);}

  if(st==='dying'){

    drawHero(hx,GY-jump,G.phase,st==='walk'||G.hop>0,G.hop>0,{rot:G.dizzy>0?Math.sin(G.t*14)*.2*Math.min(1,G.dizzy):0,mood:(G.knock>0||G.dizzy>0)?'sad':(G.hop>0||G.combo>=5)?'wow':G.combo>=2?'happy':undefined});
    if(G.dizzy>0){ctx.fillStyle='#E0A82E';for(let i=0;i<3;i++){const a=G.t*6+i*2.1;starPath(hx+8+Math.cos(a)*26,GY-170+Math.sin(a)*7,6.5);}}
  }
  if(st==='rewind'){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=4;for(let i=0;i<8;i++){const ly=GY*(.15+i*.1),off=(G.t*1500+i*130)%(W+200);line(W-off,ly,W-off+140,ly);}}
  if(G.ambCfg&&G.amb.length){const a=G.ambCfg;ctx.fillStyle=a.c;G.amb.forEach(p=>{ctx.globalAlpha=a.tw?.35+.45*Math.abs(Math.sin(G.t*2*p.k+p.ph)):.7;circle(p.x,p.y,a.r*p.k);});ctx.globalAlpha=1;}
  G.particles.forEach(p=>{ctx.globalAlpha=Math.min(1,Math.max(0,p.life));ctx.fillStyle=p.c;if(p.star)starPath(p.x-camX,p.y,p.s);else if(p.round){ctx.beginPath();ctx.arc(p.x-camX,p.y,p.s/2,0,7);ctx.fill();}else ctx.fillRect(p.x-camX-p.s/2,p.y-p.s/2,p.s,p.s);});
  ctx.globalAlpha=1;

const SPEED=185;
function update(dt){
  G.t+=dt;tickPlay(dt);
  if(G.shake>0)G.shake-=dt;
  G.particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.round?-60:520)*dt;p.life-=dt*(p.round?.9:1.1);});

  G.texts.forEach(t=>t.t+=dt);G.texts=G.texts.filter(t=>t.t<1.2);
  if(G.flash){G.flash.a-=dt*1.8;if(G.flash.a<=0)G.flash=null;}
  if(G.banner){G.banner.t+=dt;if(G.banner.t>1.6)G.banner=null;}
  if(G.hop>0){G.hop+=dt/.65;if(G.hop>=1)G.hop=0;}
  if(G.dizzy>0)G.dizzy-=dt;
  if(G.ambCfg){const a=G.ambCfg;G.amb.forEach(p=>{p.x+=a.vx*p.k*dt;p.y+=a.vy*p.k*dt;if(p.x>W)p.x=0;if(p.x<0)p.x=W;if(p.y>GY)p.y=GY-1;if(p.y<0)p.y=GY;});}
  if(G.shown>G.score)G.shown=G.score;
  if(G.shown<G.score)G.shown=Math.min(G.score,G.shown+Math.max(1,(G.score-G.shown)*dt*8));
  {const sv=String(Math.round(G.shown)),se=$('score');if(se.textContent!==sv)se.textContent=sv;}
  const lv=G.lvl;if(!lv)return;
  if(G.state==='rewind'){G.cam+=(camTarget()-G.cam)*Math.min(1,dt*6);}
  else G.cam=camTarget();
  if(ovOpen)return;
  lv.obstacles.forEach(o=>{if(o.atk>0){o.atk+=dt/.8;if(o.atk>=1)o.atk=0;}});
  if(G.knock>0){G.knock+=dt/.5;if(G.knock>=1)G.knock=0;}
  const st=G.state;
  if(st==='walk'){
    const sp=SPEED*(1+Math.min(.6,G.combo*.08));G.heroX+=sp*dt;G.phase+=dt*sp/16;G.dust-=dt;
    if(G.dust<=0&&!reduce){G.dust=.12;G.particles.push({x:G.heroX-48,y:GY-90+Math.random()*20,vx:-30-Math.random()*20,vy:-10,life:.8,c:'rgba(255,255,255,.8)',s:7,round:true});}
    G.bub-=dt;if(G.bub<=0){G.bub=1.2+Math.random()*1.6;play('bubble');}
    lv.bonuses.forEach(b=>{
      if(!b.got&&G.heroX>=b.x-20){
        b.got=true;play('bonus_'+b.kind);
        let msg='';
        if(b.kind==='heart'){G.hearts=Math.min(5,G.hearts+1);msg='+1 vie';}
        else if(b.kind==='shield'){G.shield=1;msg='Bouclier';}
        else if(b.kind==='lamp'){G.lamp++;msg='Lanterne';toast('<b>Lanterne !</b><br>Pendant une question, touche-la.<br>Elle enlève 2 mauvaises réponses.','warn',5000);}
        else{G.score+=25;msg='+25';bumpScore();}
        G.texts.push({x:b.x,y:GY-140,t:0,s:msg,c:'#14305E'});burst(b.x,GY-110,['#FFE79A','#FFFFFF'],8);celebrate(b.x,GY-110,reduce?4:12);flash('#FFE79A',.2);buzz(10);
        updateHUD();
      }
    });
    const o=lv.obstacles[G.oi];
    if(o&&G.heroX>=o.x-KIND_STOP[o.kind]){G.heroX=o.x-KIND_STOP[o.kind];showQuestion();}
    else if(!o&&G.heroX>=lv.goalX-70){G.heroX=lv.goalX-70;openWin();}
    updateProgress();
  }else if(st==='ask'&&!G.locked&&G.tTotal>0){
    G.tLeft-=dt;
    $('timerFill').style.width=Math.max(0,G.tLeft/G.tTotal*100)+'%';
    const sec=Math.max(0,Math.ceil(G.tLeft));
    if($('timerTxt').textContent!==String(sec))$('timerTxt').textContent=sec;
    $('timer').classList.toggle('low',G.tLeft<=3);
    if(G.tLeft<=3&&sec>0&&sec!==G.tick){G.tick=sec;play('tick',3-sec);}
    if(G.tLeft<=0)answer(-1);
  }else if(st==='clearing'){
    G.clearT+=dt/1.3;
    lv.obstacles[G.oi].clearT=Math.min(1,G.clearT);
    if(G.clearT>=1){G.oi++;G.state='walk';updateHUD();}
  }else if(st==='dying'){
    G.dyT+=dt/1.5;
    if(!reduce&&Math.random()<dt*14)G.particles.push({x:G.heroX+(Math.random()-.5)*40,y:GY-110,vx:(Math.random()-.5)*40,vy:-20,life:1,c:'rgba(255,255,255,.85)',s:8,round:true});
    if(G.dyT>=1)showDeadSheet();
  }else if(st==='rewind'){
    G.rewT+=dt/.9;
    if(G.rewT>=1){restartLevel();G.state='respawn';G.rsT=0;G.cam=camTarget();play('respawn');flash('#FFFFFF',.5);celebrate(130,GY-100,reduce?6:24);banner('C’est reparti !','#14305E');MUSIC.start(themeIdx());}
  }else if(st==='respawn'){
    G.rsT+=dt/.7;
    if(G.rsT>=1)G.state='walk';
  }
}
let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  update(dt);drawScene();drawPreview();
  requestAnimationFrame(frame);
}
function fit(){
  const r=stage.getBoundingClientRect();const cw=Math.max(240,r.width),ch=Math.max(240,r.height);
  const short=window.matchMedia('(orientation:landscape) and (max-height:520px)').matches;
  let s=Math.min(1.1,Math.max(.8,cw/460),ch/520);
  W=Math.round(cw/s);if(W>1000){W=1000;s=cw/W;}
  H=Math.round(ch/s);
  GY=Math.max(Math.round(H*.4),Math.round(H-((short?170:268)+14)/s));
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  const d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(cw*d);cv.height=Math.round(ch*d);
}

if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);

})();
